# 研修コース e チケット購入サイト（ローカル検証専用）の Rust ワークスペース。
# 業務の 4 crate（course_catalog・eligibility・training_budget・purchasing）は純粋関数だけを持ち、
# データストア（in_memory_store）と Web API（web_api）の crate には依存しない（NFR7.1）。
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
