[package]
name = "web_api"
description = "アダプター WebApi: HTTP の受け口と部品の組み立て（ローカル検証専用）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
course_catalog = { version = "0.1.0", path = "../course_catalog" }
eligibility = { version = "0.1.0", path = "../eligibility" }
in_memory_store = { version = "0.1.0", path = "../in_memory_store" }
purchasing = { version = "0.1.0", path = "../purchasing" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
training_budget = { version = "0.1.0", path = "../training_budget" }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
