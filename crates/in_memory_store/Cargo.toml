[package]
name = "in_memory_store"
description = "アダプター InMemoryStore: メモリ上のデータストアと初期データ（PostgreSQL の代わり）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
course_catalog = { version = "0.1.0", path = "../course_catalog" }
eligibility = { version = "0.1.0", path = "../eligibility" }
purchasing = { version = "0.1.0", path = "../purchasing" }
thiserror = "2.0.21"
training_budget = { version = "0.1.0", path = "../training_budget" }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
